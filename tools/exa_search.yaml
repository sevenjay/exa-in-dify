identity:
  name: exa_search
  author: sevenjay
  label:
    en_US: Exa Search
    zh_Hans: Exa 搜索
    pt_BR: Pesquisa Exa
    ja_JP: Exa 検索
description:
  human:
    en_US: Perform semantic search on the web using Exa's AI-powered search engine to find relevant web content and documents.
    zh_Hans: 使用 Exa 的人工智能搜索引擎在网络上执行语义搜索，查找相关网页内容和文档。
    pt_BR: Realize pesquisas semânticas na web usando o mecanismo de busca com IA da Exa para encontrar conteúdo e documentos relevantes.
    ja_JP: Exaの AI 搜索エンジンを使用してウェブ上で意味検索を実行し、関連コンテンツやドキュメントを検索します。
  llm: A tool for performing semantic search on the web using Exa's AI-powered search engine to find relevant content, websites, and documents.
output_schema:
  type: object
  description: The JSON response containing the search results, simplified to include only URLs and image URLs.
  properties:
    urls:
      type: array
      description: An array of URLs from the search results
      items:
        type: string
    images:
      type: array 
      description: An array of image URLs from the search results
      items:
        type: string
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: Search query
      zh_Hans: 搜索查询
      pt_BR: Consulta de pesquisa
      ja_JP: 検索クエリ
    human_description:
      en_US: The search query you want to perform using Exa's search engine.
      zh_Hans: 您想使用 Exa 搜索引擎执行的搜索查询。
      pt_BR: A consulta de pesquisa que você deseja realizar usando o mecanismo de busca da Exa.
      ja_JP: Exa の検索エンジンを使用して実行したい検索クエリ。
    llm_description: The search query to find relevant information on the web.
    form: llm
  - name: search_type
    type: select
    required: false
    default: auto
    label:
      en_US: Search Type
      zh_Hans: 搜索类型
      pt_BR: Tipo de pesquisa
      ja_JP: 検索タイプ
    human_description:
      en_US: The type of search to perform. Auto is recommended for most queries.
      zh_Hans: 要执行的搜索类型。自动适用于大多数查询。
      pt_BR: O tipo de pesquisa a ser realizada. Auto é recomendado para a maioria das consultas.
      ja_JP: 実行する検索のタイプ。ほとんどのクエリには自動が推奨されます。
    llm_description: Auto is recommended for most searches. Lite uses cached content. Deep Lite and Deep perform multi-step research.
    options:
      - label:
          en_US: Auto
          zh_Hans: 自动
          pt_BR: Auto
          ja_JP: 自動
        value: auto
      - label:
          en_US: Lite
          zh_Hans: 轻量
          pt_BR: Leve
          ja_JP: ライト
        value: lite
      - label:
          en_US: Deep Lite
          zh_Hans: 轻量深度
          pt_BR: Pesquisa profunda leve
          ja_JP: ディープライト
        value: deep-lite
      - label:
          en_US: Deep
          zh_Hans: 深度
          pt_BR: Profundo
          ja_JP: ディープ
        value: deep
    form: form
  - name: num_results
    type: number
    required: false
    default: 10
    min: 1
    max: 100
    label:
      en_US: Number of Results
      zh_Hans: 结果数量
      pt_BR: Número de resultados
      ja_JP: 結果数
    human_description:
      en_US: The maximum number of search results to return (from 1 to 100).
      zh_Hans: 要返回的最大搜索结果数（从1到100）。
      pt_BR: O número máximo de resultados de pesquisa a serem retornados (de 1 a 100).
      ja_JP: 返す検索結果の最大数（1〜100）。
    llm_description: The maximum number of search results to return, ranging from 1 to 100.
    form: form
  - name: include_domains
    type: string
    required: false
    label:
      en_US: Include Domains
      zh_Hans: 包含域名
      pt_BR: Incluir domínios
      ja_JP: 含めるドメイン
    human_description:
      en_US: A comma-separated list of domains to specifically include in the search results.
      zh_Hans: 要在搜索结果中特别包含的域名的逗号分隔列表。
      pt_BR: Uma lista separada por vírgulas de domínios para incluir especificamente nos resultados da pesquisa.
      ja_JP: 検索結果に特に含めるドメインのカンマ区切りリスト。
    llm_description: A comma-separated list of domains to specifically include in the search results.
    form: llm
  - name: exclude_domains
    type: string
    required: false
    label:
      en_US: Exclude Domains
      zh_Hans: 排除域名
      pt_BR: Excluir domínios
      ja_JP: 除外するドメイン
    human_description:
      en_US: A comma-separated list of domains to specifically exclude from the search results.
      zh_Hans: 要从搜索结果中特别排除的域名的逗号分隔列表。
      pt_BR: Uma lista separada por vírgulas de domínios para excluir especificamente dos resultados da pesquisa.
      ja_JP: 検索結果から特に除外するドメインのカンマ区切りリスト。
    llm_description: A comma-separated list of domains to specifically exclude from the search results.
    form: llm
  - name: start_published_date
    type: string
    required: false
    label:
      en_US: Start Published Date
      zh_Hans: 开始发布日期
      pt_BR: Data de publicação inicial
      ja_JP: 公開開始日
    human_description:
      en_US: Only include results published after this date (YYYY-MM-DD format).
      zh_Hans: 仅包含在此日期之后发布的结果（YYYY-MM-DD 格式）。
      pt_BR: Incluir apenas resultados publicados após esta data (formato AAAA-MM-DD).
      ja_JP: この日付以降に公開された結果のみを含める（YYYY-MM-DD形式）。
    llm_description: Only include results published after this date in YYYY-MM-DD format.
    form: llm
  - name: end_published_date
    type: string
    required: false
    label:
      en_US: End Published Date
      zh_Hans: 结束发布日期
      pt_BR: Data de publicação final
      ja_JP: 公開終了日
    human_description:
      en_US: Only include results published before this date (YYYY-MM-DD format).
      zh_Hans: 仅包含在此日期之前发布的结果（YYYY-MM-DD 格式）。
      pt_BR: Incluir apenas resultados publicados antes desta data (formato AAAA-MM-DD).
      ja_JP: この日付以前に公開された結果のみを含める（YYYY-MM-DD形式）。
    llm_description: Only include results published before this date in YYYY-MM-DD format.
    form: llm
  - name: max_age_hours
    type: number
    required: false
    min: -1
    max: 720
    label:
      en_US: Max Age (Hours)
      zh_Hans: 最大缓存时间（小时）
      pt_BR: Idade Máxima (Horas)
      ja_JP: 最大キャッシュ時間（時間）
    human_description:
      en_US: Set the maximum age of cached content in hours. 0 requests live content and -1 uses the cache only. Leave empty in Lite mode.
      zh_Hans: 设置缓存内容的最长有效期（小时）。0 请求实时内容，-1 仅使用缓存。轻量模式请留空。
      pt_BR: Defina a idade máxima do cache em horas. 0 solicita conteúdo ao vivo e -1 usa apenas o cache. Deixe em branco no modo Leve.
      ja_JP: キャッシュの最大経過時間を指定します。0 はライブ取得、-1 はキャッシュのみ。ライトでは空欄にします。
    llm_description: Maximum cache age in hours. 0 requests live content and -1 uses only cached content. Omit in Lite mode.
    form: form
  - name: include_highlights
    type: boolean
    required: false
    default: true
    label:
      en_US: Include Highlights
      zh_Hans: 包含高亮摘要
      pt_BR: Incluir Destaques
      ja_JP: ハイライトを含める
    human_description:
      en_US: Return query-relevant excerpts from each result. Recommended for most use cases.
      zh_Hans: 返回每个结果中与查询相关的摘要。适用于大多数场景。
      pt_BR: Retorna trechos relevantes de cada resultado. Recomendado para a maioria dos casos.
      ja_JP: 各結果からクエリに関連する抜粋を返します。ほとんどのケースで推奨。
    llm_description: Return query-relevant excerpts from each result. Uses fewer tokens than full text and is recommended for most use cases.
    form: form
  - name: highlights_max_characters
    type: number
    required: false
    min: 1
    max: 1000000
    label:
      en_US: Highlights Max Characters
      zh_Hans: 高亮最大字符数
      pt_BR: Máx. Caracteres de Destaques
      ja_JP: ハイライト最大文字数
    human_description:
      en_US: Maximum combined length of highlights per result in characters.
      zh_Hans: 每个结果的高亮摘要总字符上限。
      pt_BR: Limite total de caracteres dos destaques por resultado.
      ja_JP: 結果ごとのハイライトの合計文字数の上限。
    llm_description: Maximum combined length of highlights per result in characters.
    form: form
  - name: include_text
    type: boolean
    required: false
    default: false
    label:
      en_US: Include Full Text
      zh_Hans: 包含全文
      pt_BR: Incluir Texto Completo
      ja_JP: 全文を含める
    human_description:
      en_US: Return the full page text for each result. Opt-in; uses more tokens.
      zh_Hans: 返回每个结果的完整页面文本。选择启用；使用更多 token。
      pt_BR: Retorna o texto completo da página para cada resultado. Opt-in; usa mais tokens.
      ja_JP: 各結果の完全なページテキストを返します。オプトイン；より多くのトークンを使用。
    llm_description: Return the full page text for each result. Opt-in and uses more tokens than highlights.
    form: form
  - name: category
    type: select
    required: false
    label:
      en_US: Category
      zh_Hans: 类别
      pt_BR: Categoria
      ja_JP: カテゴリ
    human_description:
      en_US: A data category to focus on.
      zh_Hans: 要集中的数据类别。
      pt_BR: Uma categoria de dados para se concentrar.
      ja_JP: 集中するデータのカテゴリ。
    llm_description: Company and People disallow publication date filters. People also disallows domain exclusions.
    options:
      - label:
          en_US: Company
          zh_Hans: 公司
          pt_BR: Empresa
          ja_JP: 会社
        value: company
      - label:
          en_US: People
          zh_Hans: 人物
          pt_BR: Pessoas
          ja_JP: 人物
        value: people
      - label:
          en_US: Publication
          zh_Hans: 学术出版物
          pt_BR: Publicação
          ja_JP: 学術出版物
        value: publication
      - label:
          en_US: News
          zh_Hans: 新闻
          pt_BR: Notícias
          ja_JP: ニュース
        value: news
      - label:
          en_US: Personal Site
          zh_Hans: 个人网站
          pt_BR: Site Pessoal
          ja_JP: 個人サイト
        value: personal site
      - label:
          en_US: Financial Report
          zh_Hans: 财务报告
          pt_BR: Relatório Financeiro
          ja_JP: 財務報告
        value: financial report
    form: form
extra:
  python:
    source: tools/exa_search.py
